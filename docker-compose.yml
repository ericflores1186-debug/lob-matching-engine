services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lob
      POSTGRES_PASSWORD: lob
      POSTGRES_DB: lob
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lob -d lob"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lob-pgdata:/var/lib/postgresql/data

volumes:
  lob-pgdata:
