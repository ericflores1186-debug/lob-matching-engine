name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lob
          POSTGRES_PASSWORD: lob
          POSTGRES_DB: lob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lob -d lob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff==0.8.4
      - run: ruff check backend
      - name: pytest
        env:
          LOB_TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://lob:lob@localhost:5432/lob_test' || '' }}
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
